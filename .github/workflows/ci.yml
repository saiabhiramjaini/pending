name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pending
          POSTGRES_PASSWORD: pending-test-only
          POSTGRES_DB: pending_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pending -d pending_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd packages/api-contract
      - run: bun install
      - run: bun run typecheck
      - run: bun run db:push
        env:
          DATABASE_URL: postgresql://pending:pending-test-only@localhost:5432/pending_test
      - run: bun test
        env:
          TEST_DATABASE_URL: postgresql://pending:pending-test-only@localhost:5432/pending_test
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --cwd ../server/packages/api-contract
      - run: bun install
      - run: bun run typecheck
      - run: bun test
