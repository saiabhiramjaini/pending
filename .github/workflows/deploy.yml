name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  PROJECT: d6vs-496512
  REGION: asia-southeast1
  SERVICE: pending-api
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: asia-southeast1-docker.pkg.dev/d6vs-496512/pending/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/133773769155/locations/global/workloadIdentityPools/github/providers/pending
          service_account: github-deployer@d6vs-496512.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -t "$IMAGE" server
      - run: docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" --quiet \
            --image "$IMAGE" \
            --service-account "pending-api@$PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --set-secrets DATABASE_URL=pending-database-url:latest,JWT_SECRET=pending-jwt-secret:latest \
            --memory 512Mi --cpu 1 --min-instances 0 --max-instances 2
      - name: Check the deployed API
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$url/api/v1/health"
