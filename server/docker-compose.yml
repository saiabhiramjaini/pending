services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pending
      POSTGRES_PASSWORD: pending
      POSTGRES_DB: pending
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pending"]
      interval: 2s
      timeout: 5s
      retries: 20
